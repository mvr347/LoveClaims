    recipe:
      enabled: true
      shape:
        - "EAE"
        - "ADA"
        - "EAE"
      ingredients:
        E: ENDER_PEARL
        A: AMETHYST_SHARD
        D: DIAMOND

  modified_domain:
    rarity: MODIFIED
    material: AMETHYST_SHARD
    custom-model-data: 1002
    name: "<light_purple>Модифицированный Домейн</light_purple>"
    lore:
      - "<dark_gray>Модифицированный гем территории (2 слота)</dark_gray>"
      - ""
      - "<gray>Значительно расширяет границы клейма.</gray>"
