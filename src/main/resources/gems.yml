# ВНИМАНИЕ: Легендарные гемы (imperium_* и archon_*) НЕ
# регистрируются в рецептах верстака по правилам баланса.
# Уровни зелий задаются человекочитаемо (1 = I, 2 = II).
# ====================================================== #

settings:
  # Бонус радиуса при активации 1 расширения сверх лимита якоря от Домейн Империум
  imperium-extra-expansion-radius: 10

