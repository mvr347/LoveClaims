# ====================================================== #
#               AdvancedClaims - Основной конфиг         #
# ====================================================== #
# Плагин защиты территорий для Minecraft Paper 1.21
# ====================================================== #

# ===== НАСТРОЙКИ ЯЗЫКА =====
language: "ru"

# ===== НАСТРОЙКИ ПРИВАТОВ =====
claims:
  max-claims-default: 3
  max-radius-default: 50
  min-radius: 5
  claim-cost-per-block: 0
  unclaim-refund-percent: 50

# ===== НАСТРОЙКИ АРЕНДЫ =====
rental:
  enabled: true
  max-rentals-per-player: 2
  min-price: 10
  max-price: 100000
  min-duration-hours: 1
  max-duration-hours: 720

# ===== НАЛОГИ =====
tax:
  enabled: false
  percent: 0

# ====================================================== #
#                   ЗАЩИТА СПАВНА                        #
# ====================================================== #
# Глобальная защита территории спавна.
# Не требует якоря, работает автоматически.
spawn-claim:
  enabled: true               # Включить ли защиту спавна?
  world: "world"              # Название мира, где находится спавн
  x: 0                        # Координата X центра спавна
  z: 0                        # Координата Z центра спавна
  radius: 300                 # Радиус защиты спавна (в блоках)
  say-break-message: true     # Писать ли сообщение при попытке сломать блок?
  
  # Глобальные флаги на территории спавна
  # true = разрешено, false = запрещено
  flags:
    break-blocks: false       # Ломать блоки
    place-blocks: false       # Ставить блоки
    explosions: false         # Взрывы (криперы, TNT)
    enderpearl: false         # Телепорт жемчугом
    chorus: false             # Телепорт корусом
    elytra: false             # Полеты на элитрах
    pvp: false                # PvP бой
    interact: false            # Открывать двери/люки/кнопки/рычаги и контейнеры
    # 29.09.2026: false = игрок не может спавнить сущности на спавне (лодки, вагонетки, стойки для
    # брони, кристаллы, рамки, картины, яйца призыва, вёдра с рыбой) — без сообщения. Иначе спавн
    # можно завалить транспортом и мобами, а вагонетки/лодки часто используют для обхода защиты.
    spawn-entities: false

  # Истощение голода на спавне.
  # 0.0 = ваниль, 1.0 = голод на спавне не падает вообще. Восстановление (еда) не трогаем.
  # 28.09.2026: полностью отключено (1.0) — игроки подолгу стоят на спавне.
  food-depletion-reduction: 1.0

# ====================================================== #
#                  ЗАЩИТА ОТ ДЮПОВ                       #
# ====================================================== #
# 29.09.2026: фиксы известных дюпов через порталы. Все включены: ни один из них не мешает
# обычной игре, а дюп предметов ломает экономику сервера. Отключайте пункт только для отладки.
# Дюпы через поршни, рельсы/ковры и гравитационные блоки закрываются не здесь, а настройками
# Paper (unsupported-settings.allow-* в paper-global.yml) — они должны оставаться false.
dupe-protection:
  enabled: true
  # Лодки/вагонетки с сундуком или воронкой и вьючные животные с сундуком не проходят портал
  # (сущность и её содержимое сохраняются в двух мирах — классический дюп).
  chested-entities-portal: true
  # Падающие блоки (песок, гравий) и активированный TNT не проходят портал.
  falling-blocks-portal: true

# ====================================================== #
#                  НАСТРОЙКИ ГРАНИЦ                      #
# ====================================================== #
border:
  material: "GREEN_STAINED_GLASS"
  show-duration-seconds: 10

# ===== ПРОЧЕЕ =====
messages:
  prefix: "<gradient:#55FF55:#00AA00><bold>Приваты</bold></gradient> <dark_gray>»</dark_gray> "
