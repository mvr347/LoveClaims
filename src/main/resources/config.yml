# ====================================================== #
#               AdvancedClaims - Основной конфиг         #
# ====================================================== #
# Плагин защиты территорий для Minecraft Paper 1.21
# ====================================================== #

# ===== НАСТРОЙКИ ЯЗЫКА =====
language: "ru"

# ===== НАСТРОЙКИ ПРИВАТОВ =====
claims:
  max-claims-default: 3
  max-radius-default: 50
  min-radius: 5
  claim-cost-per-block: 0
  unclaim-refund-percent: 50

# ===== НАСТРОЙКИ АРЕНДЫ =====
rental:
  enabled: true
  max-rentals-per-player: 2
  min-price: 10
  max-price: 100000
  min-duration-hours: 1
  max-duration-hours: 720

  # Торговые точки (2026-09-30): арендуемые участки рынка, торговлей на них занимается LoveShops.
  # Точкой плот становится командой /rental admin settype <плот> trade_point.
  trade-points:
    enabled: true
    # Одна точка на игрока: рынок рассчитан на много разных торговцев, а не на одного с сетью точек.
    max-per-player: 1
    # Неделя: короче — торговцы ежедневно тратят время на продление, длиннее — точки занимают «мёртвые души».
    period-days: 7
    # Процент цены плота, который платится за каждый следующий период (100 = вся цена).
    renewal-percent: 100
    # Продление списывается автоматически, пока торговец офлайн (из кассы точки в LoveShops).
    auto-renew: true
    # Пробуем продлить за это время до конца срока: успеть до конца, но не платить за неделю вперёд.
    auto-renew-lead-hours: 2
    # Предупреждение арендатору (событие для LoveShops) за сутки до конца срока.
    warn-hours: 24
    # Если продлить не удалось, точка остаётся за торговцем на это время: точка закрыта, вещи целы.
    grace-hours: 12
    # Сколько периодов можно оплатить вперёд (защита от «занял навсегда»).
    max-prepaid-periods: 4

# ===== НАЛОГИ =====
tax:
  enabled: false
  percent: 0

# ====================================================== #
#                   ЗАЩИТА СПАВНА                        #
# ====================================================== #
# Глобальная защита территории спавна.
# Не требует якоря, работает автоматически.
spawn-claim:
  enabled: true               # Включить ли защиту спавна?
  world: "world"              # Название мира, где находится спавн
  x: 0                        # Координата X центра спавна
  z: 0                        # Координата Z центра спавна
  radius: 300                 # Радиус защиты спавна (в блоках)
  say-break-message: true     # Писать ли сообщение при попытке сломать блок?
  
  # Глобальные флаги на территории спавна
  # true = разрешено, false = запрещено
  flags:
    break-blocks: false       # Ломать блоки
    place-blocks: false       # Ставить блоки
    explosions: false         # Взрывы (криперы, TNT)
    enderpearl: false         # Телепорт жемчугом
    chorus: false             # Телепорт корусом
    elytra: false             # Полеты на элитрах
    pvp: false                # PvP бой
    interact: false            # Открывать двери/люки/кнопки/рычаги и контейнеры
    # 2026-09-29: игроки не спавнят сущности (лодки, вагонетки, стойки для брони, кристаллы Энда,
    # рамки, картины, яйца призыва). Отказ БЕЗ сообщения - так просили. Вне спавна то же самое
    # действует в чужом привате (без права BUILD). Обход: loveclaims.bypass / admin / moderator.
    entities: false            # Спавнить сущности игроком

  # Истощение голода на спавне.
  # 0.0 = ваниль, 1.0 = голод на спавне не падает вообще. Восстановление (еда) не трогаем.
  # 28.09.2026: полностью отключено (1.0) — игроки подолгу стоят на спавне.
  food-depletion-reduction: 1.0

# ====================================================== #
#                   ЗАЩИТА ОТ ДЮПОВ                      #
# ====================================================== #
# 2026-09-29: дюпы семейства «сущность через портал». Сущность/падающий блок сохраняется в одном
# измерении, уже будучи перенесённым в другое, и после гонки сохранения существует дважды.
# Порталы для игроков, обычных мобов и пустых транспортных средств не затрагиваются.
# 2026-09-29 (доп.): те же сущности закрыты и у шлюзов Энда - там перенос идёт обычной
# телепортацией, а не событием портала, поэтому первый фильтр их пропускал. Плюс выход с сервера
# верхом на осле/лодке с сундуком: транспорт с содержимым оказывается привязан к игроку, который
# сохраняется и выгружается в тот же момент (дюп при выходе), поэтому игрока сначала спешиваем.
# Остальные известные дюпы (поршни, рельсы/ковры/TNT, небезопасный портал Энда) закрываются
# настройками самого Paper (paper-global.yml -> unsupported-settings), а не плагином:
# allow-piston-duplication: false, allow-headless-pistons: false,
# allow-permanent-block-break-exploits: false, allow-unsafe-end-portal-teleportation: false,
# allow-tripwire-disarm-exploits: false, allow-grindstone-overstacking: false
# (названия зависят от версии Paper; недостающие в вашей версии просто игнорируются).
dupe-guard:
  block-falling-block-portals: true     # Песок/гравий/наковальни/яйцо дракона через портал и шлюз Энда
  block-tnt-portals: true               # Заряженный TNT через портал и шлюз Энда
  block-container-entity-portals: true  # Вагонетки с сундуком/воронкой, лодки с сундуком, ослы/мулы/ламы
  eject-on-quit: true                   # Спешивать игрока с транспорта с сундуком при выходе с сервера

# ====================================================== #
#                 ЗАЩИТА ОТ ЛОМАНИЯ БЕДРОКА               #
# ====================================================== #
# 2026-09-29: способы сломать бедрок (клиент с мгновенным ломанием, модифицированные взрывы,
# трюки с поршнями) в конце концов упираются в несколько серверных событий, поэтому защита стоит
# на них, а не пытается узнавать каждый трюк. Блок с отрицательной твёрдостью (бедрок, барьер,
# рамка портала Энда, командные блоки, структурный блок, укреплённый глубинный сланец и т.п.)
# выживанием сломать нельзя в принципе, значит любая попытка - подделка. Отказ БЕЗ сообщения.
# Обход: креатив + loveclaims.bypass / admin / moderator.
# Поршневые трюки, не доходящие до этих событий, закрывает Paper:
# allow-permanent-block-break-exploits: false.
bedrock-guard:
  block-breaking: true       # Отменять начало и завершение ломания неломаемых блоков
  explosions: true           # Убирать неломаемые блоки из списка разрушений взрыва
  # Основная цель ломающих бедрок - крыша Незера (y >= 128 над потолком). Телепорты жемчугом/
  # плодом хоруса и установка блоков на крыше запрещены; команды и плагины (/tp, варпы) не трогаем.
  protect-nether-roof: true

# ====================================================== #
#                  НАСТРОЙКИ ГРАНИЦ                      #
# ====================================================== #
border:
  material: "GREEN_STAINED_GLASS"
  show-duration-seconds: 10

# 2026-10-01: границы показываются частицами только по событию, а не всем подряд рядом с участком —
# иначе постоянный «забор» из частиц мозолил глаза у каждого, кто просто шёл мимо.
proximity-border:
  enabled: true
  detection-distance: 8.0      # Радиус поиска чужих приватов, пока игрок ходит с якорем
  require-anchor: true         # Подсказка только пока в руке якорь и игрок движется (стоящему — ничего)
  overlap-seconds: 5           # Сколько секунд виден чужой приват, который задел якорь при установке
  rental-preview-seconds: 3    # Сколько секунд виден rental / торговая точка при ПКМ на покупку
  particle-max-points: 600     # Потолок частиц на один контур: большие участки не должны заваливать клиента

# ===== ПРОЧЕЕ =====
messages:
  prefix: "<gradient:#55FF55:#00AA00><bold>Приваты</bold></gradient> <dark_gray>»</dark_gray> "
