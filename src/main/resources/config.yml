# ====================================================== #
#               AdvancedClaims - Основной конфиг         #
# ====================================================== #
# Плагин защиты территорий для Minecraft Paper 1.21
# ====================================================== #

# ===== НАСТРОЙКИ ЯЗЫКА =====
language: "ru"

# ===== НАСТРОЙКИ ПРИВАТОВ =====
claims:
  max-claims-default: 3
  max-radius-default: 50
  min-radius: 5
  claim-cost-per-block: 0
  unclaim-refund-percent: 50

# ===== НАСТРОЙКИ АРЕНДЫ =====
rental:
  enabled: true
  max-rentals-per-player: 2
  min-price: 10
  max-price: 100000
  min-duration-hours: 1
  max-duration-hours: 720

# ===== НАЛОГИ =====
tax:
  enabled: false
  percent: 0

# ====================================================== #
#                   ЗАЩИТА СПАВНА                        #
# ====================================================== #
# Глобальная защита территории спавна.
# Не требует якоря, работает автоматически.
spawn-claim:
  enabled: true               # Включить ли защиту спавна?
  world: "world"              # Название мира, где находится спавн
  x: 0                        # Координата X центра спавна
  z: 0                        # Координата Z центра спавна
  radius: 300                 # Радиус защиты спавна (в блоках)
  say-break-message: true     # Писать ли сообщение при попытке сломать блок?
  
  # Глобальные флаги на территории спавна
  # true = разрешено, false = запрещено
  flags:
    break-blocks: false       # Ломать блоки
    place-blocks: false       # Ставить блоки
    explosions: false         # Взрывы (криперы, TNT)
    enderpearl: false         # Телепорт жемчугом
    chorus: false             # Телепорт корусом
    elytra: false             # Полеты на элитрах
    pvp: false                # PvP бой
    interact: false            # Открывать двери/люки/кнопки/рычаги и контейнеры
    # 2026-09-29: игроки не спавнят сущности (лодки, вагонетки, стойки для брони, кристаллы Энда,
    # рамки, картины, яйца призыва). Отказ БЕЗ сообщения - так просили. Вне спавна то же самое
    # действует в чужом привате (без права BUILD). Обход: loveclaims.bypass / admin / moderator.
    entities: false            # Спавнить сущности игроком

  # Истощение голода на спавне.
  # 0.0 = ваниль, 1.0 = голод на спавне не падает вообще. Восстановление (еда) не трогаем.
  # 28.09.2026: полностью отключено (1.0) — игроки подолгу стоят на спавне.
  food-depletion-reduction: 1.0

# ====================================================== #
#                   ЗАЩИТА ОТ ДЮПОВ                      #
# ====================================================== #
# 2026-09-29: дюпы семейства «сущность через портал». Сущность/падающий блок сохраняется в одном
# измерении, уже будучи перенесённым в другое, и после гонки сохранения существует дважды.
# Порталы для игроков, обычных мобов и пустых транспортных средств не затрагиваются.
# Остальные известные дюпы (поршни, рельсы/ковры/TNT, небезопасный портал Энда) закрываются
# настройками самого Paper (paper-global.yml -> unsupported-settings), а не плагином:
# allow-piston-duplication: false, allow-headless-pistons: false,
# allow-permanent-block-break-exploits: false, allow-unsafe-end-portal-teleportation: false.
dupe-guard:
  block-falling-block-portals: true     # Песок/гравий/наковальни/яйцо дракона через портал
  block-tnt-portals: true               # Заряженный TNT через портал
  block-container-entity-portals: true  # Вагонетки с сундуком/воронкой, лодки с сундуком, ослы/мулы/ламы

# ====================================================== #
#                  НАСТРОЙКИ ГРАНИЦ                      #
# ====================================================== #
border:
  material: "GREEN_STAINED_GLASS"
  show-duration-seconds: 10

# ===== ПРОЧЕЕ =====
messages:
  prefix: "<gradient:#55FF55:#00AA00><bold>Приваты</bold></gradient> <dark_gray>»</dark_gray> "
