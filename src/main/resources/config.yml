# ====================================================== #
#               AdvancedClaims - Основной конфиг         #
# ====================================================== #
# Плагин защиты территорий для Minecraft Paper 1.21
# ====================================================== #

# ===== НАСТРОЙКИ ЯЗЫКА =====
language: "ru"

# ===== ЭКОНОМИКА =====
# 2026-10-03: пересчёт под номиналы LoveCore 1 / 100 / 2 000 / 20 000. Суммы — в медных единицах, можно строкой
# "3i 50c" (c = медная, i = железная, g = золотая, d = алмазная).
economy:
  migration:
    # Во сколько раз пересчитать цены аренды в БД при каждом шаге economy.scale-version в LoveCore.
    # 5 — середина между ростом цен в 3–8 раз; перед пересчётом делается копия RentalsSQLITE.db.pre-economy-v*.
    factor: 5.0

# ===== ИНТЕГРАЦИИ =====
# 2026-11-21: секция integrations.npc-provider удалена. NPC Сборщика налогов и арендодателей теперь поставляет
# только LoveEssential (через NpcProvider из LoveCore); Citizens и другие провайдеры не поддерживаются, выбирать
# больше не из чего. Оставленный на сервере ключ integrations.npc-provider игнорируется, плагин один раз пишет
# об этом в лог. Если LoveEssential не установлен, плагин один раз пишет предупреждение и отключает только NPC.
# Сборщик узнаётся по метке (tag), а не по имени; NPC со старым именем получают метку при первой встрече.

# ===== НАСТРОЙКИ ПРИВАТОВ =====
claims:
  max-claims-default: 3
  good-playstyle-max-claims: 3
  aggressive-playstyle-max-claims: 1
  max-radius-default: 50
  min-radius: 5
  # 2026-10-03: удалены мёртвые ключи claim-cost-per-block и unclaim-refund-percent — код их не читал, и
  # игрок видел «настройку», которая ничего не делала. Цена создания привата задаётся в anchors.yml (create-cost).

# ===== НАСТРОЙКИ АРЕНДЫ =====
rental:
  # Отдельная команда /rental (2026-10-03): отключена. Торговыми точками теперь управляет LoveShops
  # (/tradepoint, /tradepointadmin, Феодал), поэтому параллельная команда только путает игроков.
  # Логика и GUI не удалены: true вернёт команду без переписывания кода. API для LoveShops работает всегда.
  command-enabled: false
  enabled: true
  max-rentals-per-player: 2
  # Границы цены аренды, которую выставляет владелец участка (/ac → аренда → цена). Число (медные) или строка "1i".
  # 2026-10-03: ключи раньше нигде не читались — цену можно было поставить любой. Теперь проверяются. Значения
  # пересчитаны под новые номиналы (железная 100, золотая 2 000, алмазная 20 000): минимум — одна железная
  # (дешевле нет смысла: комиссия и налог округлятся до нуля), максимум 1 000 000 = 50 алмазных монет за период.
  min-price: "1i"
  max-price: 1000000
  min-duration-hours: 1
  max-duration-hours: 720

  # Торговые точки (2026-09-30): арендуемые участки рынка, торговлей на них занимается LoveShops.
  # Точкой плот становится через LoveShops (/tradepointadmin create) или LoveClaimsAPI.
  trade-points:
    enabled: true
    # Одна точка на игрока: рынок рассчитан на много разных торговцев, а не на одного с сетью точек.
    max-per-player: 1
    # Неделя: короче — торговцы ежедневно тратят время на продление, длиннее — точки занимают «мёртвые души».
    period-days: 7
    # Процент цены плота, который платится за каждый следующий период (100 = вся цена).
    renewal-percent: 100
    # Продление списывается автоматически, пока торговец офлайн (из кассы точки в LoveShops).
    auto-renew: true
    # Пробуем продлить за это время до конца срока: успеть до конца, но не платить за неделю вперёд.
    auto-renew-lead-hours: 2
    # Предупреждение арендатору (событие для LoveShops) за сутки до конца срока.
    warn-hours: 24
    # Если продлить не удалось, точка остаётся за торговцем на это время: точка закрыта, вещи целы.
    grace-hours: 12
    # Сколько периодов можно оплатить вперёд (защита от «занял навсегда»).
    max-prepaid-periods: 4

# ===== НАЛОГИ =====
tax:
  enabled: false
  percent: 0

# ====================================================== #
#                   ЗАЩИТА СПАВНА                        #
# ====================================================== #
# Глобальная защита территории спавна.
# Не требует якоря, работает автоматически.
spawn-claim:
  enabled: true               # Включить ли защиту спавна?
  world: "world"              # Название мира, где находится спавн
  x: 0                        # Координата X центра спавна
  z: 0                        # Координата Z центра спавна
  radius: 300                 # Радиус защиты спавна (в блоках)
  say-break-message: true     # Писать ли сообщение при попытке сломать блок?
  
  # Глобальные флаги на территории спавна
  # true = разрешено, false = запрещено
  flags:
    break-blocks: false       # Ломать блоки
    place-blocks: false       # Ставить блоки
    explosions: false         # Взрывы (криперы, TNT)
    enderpearl: false         # Телепорт жемчугом
    chorus: false             # Телепорт корусом
    elytra: false             # Полеты на элитрах
    pvp: false                # PvP бой
    doors: true               # Открывать двери/люки/кнопки/рычаги на спавне
    interact: false            # Открывать двери/люки/кнопки/рычаги и контейнеры
    # 2026-09-29: игроки не спавнят сущности (лодки, вагонетки, стойки для брони, кристаллы Энда,
    # рамки, картины, яйца призыва). Отказ БЕЗ сообщения - так просили. Вне спавна то же самое
    # действует в чужом привате (без права BUILD). Обход: loveclaims.bypass.
    entities: false            # Спавнить сущности игроком

  # Истощение голода на спавне.
  # 0.0 = ваниль, 1.0 = голод на спавне не падает вообще. Восстановление (еда) не трогаем.
  # 28.09.2026: полностью отключено (1.0) — игроки подолгу стоят на спавне.
  food-depletion-reduction: 1.0

# ====================================================== #
#                   ЗАЩИТА ОТ ДЮПОВ                      #
# ====================================================== #
# 2026-09-29: дюпы семейства «сущность через портал». Сущность/падающий блок сохраняется в одном
# измерении, уже будучи перенесённым в другое, и после гонки сохранения существует дважды.
# Порталы для игроков, обычных мобов и пустых транспортных средств не затрагиваются.
# 2026-09-29 (доп.): те же сущности закрыты и у шлюзов Энда - там перенос идёт обычной
# телепортацией, а не событием портала, поэтому первый фильтр их пропускал. Плюс выход с сервера
# верхом на осле/лодке с сундуком: транспорт с содержимым оказывается привязан к игроку, который
# сохраняется и выгружается в тот же момент (дюп при выходе), поэтому игрока сначала спешиваем.
# Остальные известные дюпы (поршни, рельсы/ковры/TNT, небезопасный портал Энда) закрываются
# настройками самого Paper (paper-global.yml -> unsupported-settings), а не плагином:
# allow-piston-duplication: false, allow-headless-pistons: false,
# allow-permanent-block-break-exploits: false, allow-unsafe-end-portal-teleportation: false,
# allow-tripwire-disarm-exploits: false, allow-grindstone-overstacking: false
# (названия зависят от версии Paper; недостающие в вашей версии просто игнорируются).
dupe-guard:
  block-falling-block-portals: true     # Песок/гравий/наковальни/яйцо дракона через портал и шлюз Энда
  block-tnt-portals: true               # Заряженный TNT через портал и шлюз Энда
  block-container-entity-portals: true  # Вагонетки с сундуком/воронкой, лодки с сундуком, ослы/мулы/ламы
  eject-on-quit: true                   # Спешивать игрока с транспорта с сундуком при выходе с сервера

# ====================================================== #
#                 ЗАЩИТА ОТ ЛОМАНИЯ БЕДРОКА               #
# ====================================================== #
# 2026-09-29: способы сломать бедрок (клиент с мгновенным ломанием, модифицированные взрывы,
# трюки с поршнями) в конце концов упираются в несколько серверных событий, поэтому защита стоит
# на них, а не пытается узнавать каждый трюк. Блок с отрицательной твёрдостью (бедрок, барьер,
# рамка портала Энда, командные блоки, структурный блок, укреплённый глубинный сланец и т.п.)
# выживанием сломать нельзя в принципе, значит любая попытка - подделка. Отказ БЕЗ сообщения.
# Обход: креатив + loveclaims.bypass.
# Поршневые трюки, не доходящие до этих событий, закрывает Paper:
# allow-permanent-block-break-exploits: false.
bedrock-guard:
  block-breaking: true       # Отменять начало и завершение ломания неломаемых блоков
  explosions: true           # Убирать неломаемые блоки из списка разрушений взрыва
  # Основная цель ломающих бедрок - крыша Незера (y >= 128 над потолком). Телепорты жемчугом/
  # плодом хоруса и установка блоков на крыше запрещены; команды и плагины (/tp, варпы) не трогаем.
  protect-nether-roof: true

# ====================================================== #
#                  НАСТРОЙКИ ГРАНИЦ                      #
# ====================================================== #
border:
  material: "GREEN_STAINED_GLASS"
  show-duration-seconds: 10

# 2026-10-01: границы показываются частицами только по событию, а не всем подряд рядом с участком —
# иначе постоянный «забор» из частиц мозолил глаза у каждого, кто просто шёл мимо.
proximity-border:
  enabled: true
  detection-distance: 8.0      # Радиус поиска чужих приватов, пока игрок ходит с якорем
  require-anchor: true         # Подсказка только пока в руке якорь и игрок движется (стоящему — ничего)
  overlap-seconds: 5           # Сколько секунд виден чужой приват, который задел якорь при установке
  rental-preview-seconds: 3    # Сколько секунд виден rental / торговая точка при ПКМ на покупку
  particle-max-points: 600     # Потолок частиц на один контур: большие участки не должны заваливать клиента

# ====================================================== #
#             ЗВУКИ И ЧАСТИЦЫ (2026-11-24)               #
# ====================================================== #
# 2026-11-24: раньше секции sounds не было вообще, поэтому ConfigManager#playSound молча
# возвращал NONE и ни вставка гема, ни клик по меню ничего не играли. Теперь значения заданы явно.
# Формат имён: BLOCK_ANVIL_USE или block.anvil.use. NONE отключает звук.
sounds:
  gui-click: UI_BUTTON_CLICK
  gui-error: BLOCK_NOTE_BLOCK_BASS   # gui_gen: звук заблокированной кнопки
  anchor-place: BLOCK_BEACON_ACTIVATE
  anchor-error: ENTITY_VILLAGER_NO
  anchor-break: BLOCK_GLASS_BREAK
  tax-paid: ENTITY_EXPERIENCE_ORB_PICKUP

# 2026-11-24: события гемов, якоря и слияния играют звук и частицы из одного места (ClaimEffects).
# Частицы видят только игроки в view-radius, а число частиц на событие ограничено: эффект слома
# или слияния разовый, без повторяющихся задач, чтобы не нагружать клиентов рядом с приватом.
effects-settings:
  view-radius: 32            # Дальше этого расстояния частицы не отправляются
  max-particles-per-event: 60 # Потолок частиц на одно событие

effects:
  gem-insert:
    sound: BLOCK_AMETHYST_BLOCK_CHIME
    volume: 1.0
    pitch: 1.2
    particle: ENCHANT
    count: 30
    spread: 0.6
  gem-extract:
    sound: BLOCK_AMETHYST_BLOCK_BREAK
    volume: 0.8
    pitch: 0.9
    particle: SMOKE
    count: 12
    spread: 0.4
  gem-overload-warning:
    sound: BLOCK_BEACON_DEACTIVATE
    volume: 0.8
    pitch: 1.0
    particle: ELECTRIC_SPARK
    count: 20
    spread: 0.5
  gem-fuse:
    sound: BLOCK_BEACON_ACTIVATE
    volume: 1.0
    pitch: 1.4
    particle: ENCHANT
    count: 50
    spread: 0.8
  anchor-break:
    sound: BLOCK_GLASS_BREAK
    volume: 1.0
    pitch: 0.7
    particle: EXPLOSION
    count: 3
    spread: 0.5
  core-replace:
    sound: BLOCK_ANVIL_USE
    volume: 0.7
    pitch: 1.1
    particle: WAX_ON
    count: 25
    spread: 0.6
  anchor-upgrade:
    sound: BLOCK_BEACON_POWER_SELECT
    volume: 1.0
    pitch: 1.0
    particle: END_ROD
    count: 40
    spread: 0.7
  claim-merge:
    sound: BLOCK_END_PORTAL_SPAWN
    volume: 0.4
    pitch: 1.5
    particle: PORTAL
    count: 60
    spread: 1.0
  claim-merge-denied:
    sound: ENTITY_VILLAGER_NO
    volume: 1.0
    pitch: 1.0
    particle: NONE
    count: 0
  craft-core:
    sound: BLOCK_SMITHING_TABLE_USE
    volume: 0.8
    pitch: 1.0
    particle: NONE
    count: 0
  craft-anchor:
    sound: BLOCK_SMITHING_TABLE_USE
    volume: 0.8
    pitch: 0.8
    particle: NONE
    count: 0

# ====================================================== #
#        ПЕРЕГРУЗ ЯКОРЯ СИЛЬНЫМИ ГЕМАМИ (2026-11-24)     #
# ====================================================== #
# Любой гем можно вставить в любой якорь, но гем сильнее тира якоря работает вполсилы,
# а набор слишком сильных гемов может сломать ядро якоря.
# «Разрыв» гема = (минимальный тир гема) - (тир якоря), не меньше 0:
# базовый гем = 1, модифицированный = 2, легендарный = 3.
gems:
  overload:
    # Во сколько раз режутся положительные баффы за каждый уровень разрыва. 0.5: легендарный гем
    # в якоре 1 тира (разрыв 2) даёт четверть силы. Минусы (дебафф-гемы) не режутся.
    buff-multiplier-per-gap: 0.5
    # Суммарный разрыв всех гемов, с которого вставка может сломать якорь. 3, потому что ломаться
    # должен именно набор сильных гемов: один легендарный в якоре 1 тира (разрыв 2) только работает
    # на четверть силы, а вторая сильная вставка уже переводит якорь в зону риска.
    explode-threshold: 3
    break-chance:
      at-threshold: 0.15        # суммарный разрыв == порогу
      at-threshold-plus-1: 0.40 # на 1 выше порога
      at-threshold-plus-2: 0.75 # на 2 и выше: ломается почти всегда
  # 2026-11-24: вшивание гема в якорь навсегда (раз за всё время у привата). Легендарный гем нельзя вшить
  # в якорь тира 1: он слишком силён для него. У якоря тира 3 вшивание требует дорогих ингредиентов,
  # потому что вшитый гем не режется перегрузом и не снимается, то есть это самое выгодное улучшение.
  fuse:
    tier-3-cost: "1d"            # Монеты за вшивание в якорь тира 3
    tier-3-ingredients:          # Предметы за вшивание в якорь тира 3
      NETHERITE_INGOT: 2
      DIAMOND_BLOCK: 4

# ====================================================== #
#              СЛИЯНИЕ ПРИВАТОВ (2026-11-24)             #
# ====================================================== #
# Два привата объединяются, если касаются друг друга или между ними не больше max-gap блоков.
# 3 блока: хватает, чтобы соединить соседей через дорогу или стену, но общая область не захватывает
# заметный кусок чужой земли (объединённая область - прямоугольник, охватывающий оба привата).
merge:
  max-gap: 3

# ===== ПРОЧЕЕ =====
messages:
  prefix: "<gradient:#55FF55:#00AA00>Территория</gradient> <white>»</white> "
