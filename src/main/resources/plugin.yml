name: LoveClaims
version: '1.5'
main: me.lovelace.loveclaims.LoveClaims
api-version: '26.3'
depend: [LoveCore, LoveEssential, PlaceholderAPI]
softdepend: [ItemsAdder]
authors: [lovelace]
description: Advanced anchor-based claiming system.
commands:
  ac:
    description: Основная команда клеймов
    aliases: [ claim, claims, loveclaims, клейм ]
  rental:
    description: Управление арендой
    aliases: [ rent ]
    permission: loveclaims.rental
    permission-message: ""
  loveclaimsadmin:
    description: Административные команды LoveClaims (reload и т.д.)
    permission: loveclaims.admin
    permission-message: ""
permissions:
  loveclaims.admin:
    description: Доступ к /loveclaimsadmin
    default: op
  loveclaims.admin.gems:
    description: Управление гемами (/loveclaims gem)
    default: op
  loveclaims.teleport.bypass:
    description: Телепорт на клейм без ожидания и паузы (нужен teleport.allow-bypass в config.yml)
    default: false
  loveclaims.bypass:
    description: Игнорирование защиты ВСЕХ клеймов (выдаётся явно, включая операторов)
    default: false
  loveclaims.moderator:
    description: Доступ к управлению любыми клеймами (модерация)
    default: op
  loveclaims.rental:
    description: Базовый доступ к аренде (команда /rental)
    default: true
  loveclaims.rental.admin:
    description: Администрирование аренды
    default: op
  loveclaims.rental.bypasslimit:
    description: Обход лимита на количество арендуемых участков
    default: op
